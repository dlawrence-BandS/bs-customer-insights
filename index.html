<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Insights | Barker &amp; Stonehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2740;--ivory:#f8f4ec;--line:#d9d2c3;--teal:#1f7a78;--brass:#a67c37;--muted:#5d6577;--good:#1f7a58;--bad:#a23b3b}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 15px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Playfair Display",Georgia,serif;font-weight:500;margin:0}
header{background:var(--ink);color:var(--ivory);padding:18px 32px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
header h1{font-size:24px}
header .sub{font-size:13px;color:#c9cfdd;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.controls label{font-size:13px;color:#c9cfdd;display:flex;gap:8px;align-items:center}
select,button{font:inherit}
select{background:var(--ivory);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 8px}
.signin{background:var(--brass);color:#fff;border:0;border-radius:3px;padding:8px 16px;font-weight:600;cursor:pointer}
.signin:hover{background:#8d6a2e}
nav{position:sticky;top:0;z-index:5;background:var(--ivory);border-bottom:1px solid var(--line);padding:0 32px;display:flex;flex-wrap:wrap;gap:4px 28px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 0 11px;color:var(--muted);cursor:pointer;font-weight:600}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
nav button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{padding:28px 32px 60px;max-width:1500px;margin:0 auto}
#view{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:40px}
.panel{border-top:1px solid #1c274055;padding-top:12px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h3{font-size:19px}
.note{margin:4px 0 12px;color:var(--muted);font-size:13px;max-width:78ch}
.body{position:relative}
.tiles{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px 30px}
.tile{border-left:3px solid var(--brass);padding-left:14px}
.tile .lab{font-size:13px;color:var(--muted)}
.tile .big{font-size:32px;line-height:1.15;margin:2px 0}
.tile .chg{font-size:13px}
.tile .nt{font-size:12px;color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}
.moves{list-style:none;margin:0;padding:0;columns:2 380px;column-gap:40px}
.moves li{padding:6px 0;break-inside:avoid;border-bottom:1px solid var(--line)}
.tw{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--ivory)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;margin:0 0 10px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
.msg{grid-column:1/-1;max-width:70ch;padding:8px 0}
.msg h2{font-size:28px;margin-bottom:8px}
.err{color:var(--bad)}
footer{max-width:1500px;margin:0 auto;padding:0 32px 40px;color:var(--muted);font-size:13px}
footer p{max-width:100ch;margin:4px 0}
@media (max-width:640px){header,nav,main,footer{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div><h1>Customer insights</h1><div class="sub" id="asof">Barker &amp; Stonehouse</div></div>
  <div class="controls">
    <label>Channel <select id="f-channel"><option value="all">Online and store</option><option value="online">Online</option><option value="offline">Store</option></select></label>
    <label>Months shown <select id="f-months"><option value="6">6</option><option value="12" selected>12</option><option value="24">24</option><option value="0">All</option></select></label>
    <button class="signin" id="signin" type="button">Sign in with Google</button>
  </div>
</header>
<nav id="tabs" aria-label="Dashboard sections"></nav>
<main><div id="view"></div></main>
<footer id="foot"></footer>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
'use strict';
var PROJECT='commanding-air-450109-p0', DS=PROJECT+'.customer_insights', LOCATION='europe-west2';
var CLIENT_ID='46227372300-rk63ag0caqgd7n12gjd0nt7f2qi7llqr.apps.googleusercontent.com';
var TABLES=['s_ads_monthly','s_area_penetration','s_area_profile','s_area_vs_national','s_attach_monthly','s_attribute_monthly','s_audience_sizes','s_cancel_category','s_category_monthly','s_channel_area','s_channel_monthly','s_click_collect_customers','s_click_collect_monthly','s_cohorts','s_contact_snapshot','s_customer_type_monthly','s_distance_behaviour','s_email_campaigns','s_email_monthly','s_journey_monthly','s_landing_period','s_lifestyle_category','s_lifestyle_profile','s_lapsed_pool','s_list_growth','s_next_category','s_omnichannel','s_order_mix','s_product_period','s_sales_monthly','s_source_monthly','s_store_catchment','s_store_lifestyle','s_store_profile','s_swatch_cohorts','s_swatch_fabrics','s_time_to_buy_category','s_winback_pool'];
var TABS=[['headline','Headline'],['customers','Customers and retention'],['products','What people buy'],['journey','Journey and channels'],['audiences','Audiences and email'],['places','Where customers live'],['store','Store and online']];
var D={}, token=null, charts=[], state={tab:'headline',channel:'all',months:12,attr:'colour',adDim:'age',store:'all',penDir:'top',lg:'1'};
/* Store names, from Ometria Settings > Stores. ID 11 is the phone channel, not a shop. */
var STORES={'12':'Darlington','13':'Stockton','14':'Knaresborough','15':'Metro','16':'Leeds','17':'Middlesbrough Outlet','19':'Nottingham','20':'Hull','21':'Battersea','22':'Hove','23':'Guildford','24':'Fenwick Newcastle','25':'Metro Outlet','27':'Jarrolds','34':'Fenwick Kingston'};
var sName=function(id){id=String(id); return STORES[id]||('Store '+id);};
/* Lifestyle group names: add as '1':'Name', once confirmed from the official ONS list. */
var LIFESTYLE={'1':'Retired Professionals','2':'Suburbanites / Peri-Urbanites','3':'Multicultural / Educated Urbanites','4':'Low-Skilled Migrant / Student Communities','5':'Ethnically Diverse Suburban Professionals','6':'Baseline UK','7':'Semi- / Un-Skilled Workforce','8':'Legacy Communities'};
var PAL=['#1c2740','#1f7a78','#a67c37','#5b7aa6','#7b5e8c','#8aa07a','#b5653a','#6b6b6b','#c9b27c','#3d9a96'];
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

/* ---------- BigQuery ---------- */
function cast(t,v){
  if(v===null||v===undefined) return null;
  if(t==='INTEGER'||t==='INT64'||t==='FLOAT'||t==='FLOAT64'||t==='NUMERIC') return Number(v);
  if(t==='BOOLEAN'||t==='BOOL') return v==='true';
  return v;
}
async function api(url,opt){
  var r=await fetch(url,opt); var j=await r.json();
  if(r.status===401){token=null; throw new Error('Your sign-in has expired. Sign in again.');}
  if(j.error) throw new Error(j.error.message);
  return j;
}
async function bq(sql){
  var base='https://bigquery.googleapis.com/bigquery/v2/projects/'+PROJECT;
  var h={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  var j=await api(base+'/queries',{method:'POST',headers:h,body:JSON.stringify({query:sql,useLegacySql:false,location:LOCATION,maxResults:10000,timeoutMs:60000})});
  var job=j.jobReference.jobId;
  while(!j.jobComplete){ await sleep(700); j=await api(base+'/queries/'+job+'?location='+LOCATION+'&maxResults=10000',{headers:h}); }
  var fields=j.schema.fields, rows=j.rows||[], tok=j.pageToken;
  while(tok){ var p=await api(base+'/queries/'+job+'?location='+LOCATION+'&maxResults=10000&pageToken='+tok,{headers:h}); rows=rows.concat(p.rows||[]); tok=p.pageToken; }
  return rows.map(function(row){var o={}; fields.forEach(function(f,i){o[f.name]=cast(f.type,row.f[i].v);}); return o;});
}
async function loadAll(){
  await Promise.all(TABLES.map(async function(t){ D[t]=await bq('SELECT * FROM `'+DS+'.'+t+'`'); }));
}

/* ---------- helpers ---------- */
var now=new Date(), LAST=now.getFullYear()*12+now.getMonth()-1;
var L12=[LAST-11,LAST], P12=[LAST-23,LAST-12];
var mIdx=function(s){return +s.slice(0,4)*12+ +s.slice(5,7)-1;};
var inR=function(r,w){var i=mIdx(r.month); return i>=w[0]&&i<=w[1];};
var sel=function(rows,w){return rows.filter(function(r){return inR(r,w);});};
var sum=function(rows,f){return rows.reduce(function(s,r){return s+(Number(r[f])||0);},0);};
var grp=function(rows,kf,vf){var m=new Map(); rows.forEach(function(r){var k=kf(r); m.set(k,(m.get(k)||0)+(Number(vf(r))||0));}); return m;};
var topN=function(m,n){return Array.from(m.entries()).sort(function(a,b){return b[1]-a[1];}).slice(0,n);};
var months=function(rows){return Array.from(new Set(rows.map(function(r){return r.month.slice(0,7);}))).sort();};
var shown=function(rows){var n=state.months; return rows.filter(function(r){var i=mIdx(r.month); return i<=LAST&&(!n||i>LAST-n);});};
var chan=function(rows){return state.channel==='all'?rows:rows.filter(function(r){return r.channel===state.channel;});};
var yoyRows=function(rows){return rows.filter(function(r){return r.channel===(state.channel==='offline'?'offline':'online');});};
var lab=function(s){return new Date(s.slice(0,7)+'-01T00:00:00').toLocaleString('en-GB',{month:'short',year:'numeric'});};
var dlab=function(s){return s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'–';};
var f={
  n:function(v){return v==null||isNaN(v)?'–':Math.round(v).toLocaleString('en-GB');},
  gbp:function(v){if(v==null||isNaN(v)) return '–'; var a=Math.abs(v); return (v<0?'-':'')+(a>=1e6?'£'+(a/1e6).toFixed(2)+'m':a>=1e3?'£'+Math.round(a/1e3)+'k':'£'+Math.round(a));},
  gbpx:function(v){return v==null||isNaN(v)?'–':'£'+Math.round(v).toLocaleString('en-GB');},
  p:function(v,d){return v==null||isNaN(v)?'–':v.toFixed(d==null?1:d)+'%';}
};
var ratio=function(a,b){return b?a/b*100:null;};
var chg=function(c,p){return p?(c-p)/p*100:null;};
function chgHtml(c,p,goodUp){
  var x=chg(c,p); if(x==null) return '';
  var up=x>=0, good=goodUp===false?!up:up;
  return '<span class="'+(good?'good':'bad')+'">'+(up?'▲ ':'▼ ')+Math.abs(x).toFixed(1)+'% on last year</span>';
}
function snap(){
  var d=D.s_contact_snapshot||[]; if(!d.length) return {};
  var mx=d.map(function(r){return r.snapshot_date;}).sort().pop(), o={};
  d.filter(function(r){return r.snapshot_date===mx;}).forEach(function(r){(o[r.dimension]=o[r.dimension]||{})[r.value]=r.contacts;});
  o._date=mx; return o;
}
function ordered(obj,order){
  obj=obj||{}; var keys=order.filter(function(k){return k in obj;}).concat(Object.keys(obj).filter(function(k){return order.indexOf(k)<0;}));
  return [keys,keys.map(function(k){return obj[k];})];
}

/* ---------- builders ---------- */
function clearView(){charts.forEach(function(c){c.destroy();}); charts=[]; $('#view').innerHTML='';}
function panel(title,note,wide){
  var el=document.createElement('section'); el.className='panel'+(wide?' wide':'');
  el.innerHTML='<h3>'+title+'</h3>'+(note?'<p class="note">'+note+'</p>':'')+'<div class="body"></div>';
  $('#view').appendChild(el); return el.querySelector('.body');
}
function toggle(body,opts,key){
  var d=document.createElement('div'); d.className='seg';
  opts.forEach(function(o){var b=document.createElement('button'); b.type='button'; b.textContent=o[1]; b.setAttribute('aria-pressed',String(state[key]===o[0])); b.onclick=function(){state[key]=o[0]; render();}; d.appendChild(b);});
  body.appendChild(d);
}
function chart(title,note,type,labels,datasets,o){
  o=o||{}; var b=panel(title,note,o.wide); var h=document.createElement('div'); h.style.height=(o.h||280)+'px'; h.style.position='relative';
  var c=document.createElement('canvas'); h.appendChild(c); b.appendChild(h);
  var hz=!!o.horizontal, yf=o.fmt||function(v){return v;};
  var cfg={type:type,data:{labels:labels,datasets:datasets.map(function(d,i){
      var ty=d.type||type;
      return Object.assign({backgroundColor:PAL[i%PAL.length],borderColor:PAL[i%PAL.length],borderWidth:ty==='line'?2:0,pointRadius:ty==='line'?2:0,tension:.25},d);})},
    options:{responsive:true,maintainAspectRatio:false,animation:false,indexAxis:hz?'y':'x',
      plugins:{legend:{display:datasets.length>1,position:'bottom'},tooltip:{callbacks:{label:function(c){var ff=c.dataset.fmt||yf; return (c.dataset.label?c.dataset.label+': ':'')+ff(hz?c.parsed.x:c.parsed.y);}}}},
      scales:hz?{x:{stacked:!!o.stacked,beginAtZero:true,ticks:{callback:yf}},y:{stacked:!!o.stacked,grid:{display:false}}}
               :{x:{stacked:!!o.stacked,grid:{display:false}},y:{stacked:!!o.stacked,beginAtZero:true,ticks:{callback:yf}}}}};
  if(o.y1) cfg.options.scales.y1={position:'right',beginAtZero:true,grid:{drawOnChartArea:false},ticks:{callback:o.y1}};
  charts.push(new Chart(c,cfg)); return b;
}
function table(title,note,cols,rows,o){
  o=o||{}; var b=panel(title,note,o.wide);
  if(o.before) o.before(b);
  var w=document.createElement('div'); w.className='tw';
  w.innerHTML='<table><thead><tr>'+cols.map(function(c){return '<th class="'+(c.r?'r':'')+'">'+c.h+'</th>';}).join('')+'</tr></thead><tbody>'+
    (rows.length?rows.map(function(r){return '<tr>'+cols.map(function(c){return '<td class="'+(c.r?'r':'')+'"'+(c.s?' style="'+c.s(r)+'"':'')+'>'+c.f(r)+'</td>';}).join('')+'</tr>';}).join(''):'<tr><td colspan="'+cols.length+'">No data for this selection.</td></tr>')+
    '</tbody></table>';
  b.appendChild(w);
}
function tiles(list){
  var d=document.createElement('div'); d.className='tiles';
  d.innerHTML=list.map(function(t){return '<div class="tile"><div class="lab">'+t[0]+'</div><div class="big">'+t[1]+'</div><div class="chg">'+(t[2]||'')+'</div><div class="nt">'+(t[3]||'')+'</div></div>';}).join('');
  $('#view').appendChild(d);
}
var heat=function(v,max){return v==null?'':'background:rgba(31,122,120,'+Math.min(.55,(v/max)*.55).toFixed(2)+')';};
var NICE={ACTIVE:'Active',AT_RISK:'At risk',LAPSED:'Lapsed',LEAD:'Lead','true':'Opted in','false':'Opted out'};
var nice=function(k){return NICE[k]||k;};
var demoName=function(v){
  if(!v) return 'Unknown';
  var m=/^AGE_RANGE_(\d+)_(\d+)$/.exec(v); if(m) return m[1]+'–'+m[2];
  if(v==='AGE_RANGE_65_UP') return '65+';
  return v.replace(/^AGE_RANGE_/,'').replace(/_/g,' ').toLowerCase().replace(/^./,function(c){return c.toUpperCase();});
};

/* ---------- tabs ---------- */
function headline(){
  var S=D.s_sales_monthly, CH=D.s_channel_monthly, on=function(r){return r.channel==='online';}, off=function(r){return r.channel==='offline';};
  var s12=sel(S.filter(on),L12), sp=sel(S.filter(on),P12);
  var rev=sum(s12,'revenue'), revP=sum(sp,'revenue'), ord=sum(s12,'orders'), ordP=sum(sp,'orders');
  var store=S.filter(off).filter(function(r){return mIdx(r.month)<=LAST;}), storeFrom=months(store)[0];
  var ch12=sel(CH,L12), chP=sel(CH,P12);
  var conv=ratio(sum(ch12,'purchases'),sum(ch12,'sessions')), convP=ratio(sum(chP,'purchases'),sum(chP,'sessions'));
  var canc=ratio(sum(s12,'cancelled_value'),rev+sum(s12,'cancelled_value')), cancP=ratio(sum(sp,'cancelled_value'),revP+sum(sp,'cancelled_value'));
  var sn=snap(), fq=sn.frequency||{}, lc=sn.lifecycle||{};
  var base=(fq['1 order']||0)+(fq['2 orders']||0)+(fq['3-4 orders']||0)+(fq['5+ orders']||0);
  var rep=ratio((fq['2 orders']||0)+(fq['3-4 orders']||0)+(fq['5+ orders']||0),base);
  var J=D.s_journey_monthly.filter(function(r){return r.purchase_channel!=='Not identified';}), j12=sel(J,L12), jp=sel(J,P12);
  var tc=topN(grp(j12,function(r){return r.purchase_channel;},function(r){return r.orders;}),1)[0]||['–',0];
  var tcShare=ratio(tc[1],sum(j12,'orders')), tcP=ratio(sum(jp.filter(function(r){return r.purchase_channel===tc[0];}),'orders'),sum(jp,'orders'));
  var SW=D.s_swatch_cohorts, sw12=sel(SW,L12), swp=sel(SW,P12);
  var sw=ratio(sum(sw12,'bought_90d'),sum(sw12,'eligible_90d')), swP=ratio(sum(swp,'bought_90d'),sum(swp,'eligible_90d'));

  /* what moved most */
  var mv=[];
  var C=D.s_category_monthly.filter(on), cc=grp(sel(C,L12),function(r){return r.category;},function(r){return r.revenue;}), cp=grp(sel(C,P12),function(r){return r.category;},function(r){return r.revenue;});
  cc.forEach(function(v,k){var p=cp.get(k)||0; if(p>=100000) mv.push({x:chg(v,p),t:esc(k)+' revenue online',c:v,p:p,fmt:f.gbp});});
  var cg=grp(ch12,function(r){return r.channel_group;},function(r){return r.purchases;}), cgp=grp(chP,function(r){return r.channel_group;},function(r){return r.purchases;});
  cg.forEach(function(v,k){var p=cgp.get(k)||0; if(p>=200) mv.push({x:chg(v,p),t:esc(k)+' purchases',c:v,p:p,fmt:f.n});});
  mv.sort(function(a,b){return Math.abs(b.x)-Math.abs(a.x);});
  var b=panel('What moved most compared with last year','The biggest changes in the last 12 full months against the 12 before, online only. Categories need £100k of sales and channels 200 purchases a year before they count.',true);
  b.innerHTML+='<ul class="moves">'+mv.slice(0,8).map(function(m){var up=m.x>=0; return '<li><span class="'+(up?'good':'bad')+'">'+(up?'▲ ':'▼ ')+Math.abs(m.x).toFixed(0)+'%</span> '+m.t+' ('+m.fmt(m.c)+' against '+m.fmt(m.p)+')</li>';}).join('')+'</ul>';

  tiles([
    ['Online sales, last 12 months',f.gbp(rev),chgHtml(rev,revP),'Valid orders, not swatch-only'],
    ['Store sales since '+(storeFrom?lab(storeFrom):'launch'),f.gbp(sum(store,'revenue')),'','Store data starts Jun 2026, so no year-on-year yet'],
    ['Active customers',f.n(lc.ACTIVE),'',f.n(lc.AT_RISK)+' at risk, '+f.n(lc.LAPSED)+' lapsed'],
    ['Customers who ordered more than once',f.p(rep),'','All-time share of customers with 2+ orders'],
    ['Average online order',f.gbp(ord?rev/ord:null),chgHtml(ord?rev/ord:0,ordP?revP/ordP:0),''],
    ['Purchases per 100 visits',conv==null?'–':conv.toFixed(2),chgHtml(conv,convP),'Online sessions'],
    ['Biggest purchase channel',esc(tc[0]),tcShare==null?'':f.p(tcShare,0)+' of identified orders'+(tcP==null?'':' (last year '+f.p(tcP,0)+')'),'GA4 identifies about 75–85% of orders'],
    ['Swatch customers who then bought',f.p(sw),sw==null||swP==null?'':chgHtml(sw,swP),'Within 90 days of ordering swatches'],
    ['Cancelled share of online order value',f.p(canc),chgHtml(canc,cancP,false),'Cancelled orders are excluded from sales'],
    ['Lapsed and at-risk contacts',f.n((lc.LAPSED||0)+(lc.AT_RISK||0)),'','Ometria lifecycle, as of '+dlab(sn._date)]
  ]);

  var S2=shown(D.s_sales_monthly), ms=months(S2), by=function(c,m){return sum(S2.filter(function(r){return r.channel===c&&r.month.slice(0,7)===m;}),'revenue');};
  chart('Sales by month','Valid orders, excluding swatch-only and cancelled. Store data starts in Jun 2026, which is why the bars grow from then.','bar',ms.map(lab),[{label:'Online',data:ms.map(function(m){return by('online',m);})},{label:'Store',data:ms.map(function(m){return by('offline',m);})}],{stacked:true,fmt:f.gbp});
  var T=shown(D.s_customer_type_monthly), tm=months(T), tv=function(t,m){return sum(T.filter(function(r){return r.customer_type===t&&r.month.slice(0,7)===m;}),'orders');};
  chart('New and returning customers’ orders','Orders from first-time and repeat customers, including store orders from Jun 2026. Before mid-2025 the split is approximate, because older first orders are not in the data.','bar',tm.map(lab),[{label:'New',data:tm.map(function(m){return tv('New',m);})},{label:'Returning',data:tm.map(function(m){return tv('Returning',m);})}],{stacked:true,fmt:f.n});
}

function customers(){
  var sn=snap();

var VIEWS={headline:headline,customers:customers,products:products,journey:journey,audiences:audiences,places:places,store:store};
function msg(html){clearView(); var d=document.createElement('div'); d.className='msg'; d.innerHTML=html; $('#view').appendChild(d);}
function render(top){
  document.querySelectorAll('#tabs button').forEach(function(b){if(b.dataset.tab===state.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');});
  if(!token||!D.s_sales_monthly){return;}
  clearView();
  try{ VIEWS[state.tab](); }catch(e){ msg('<h2>This section could not be drawn</h2><p class="err">'+esc(e.message)+'</p>'); if(window.console) console.error(e); }
  var sn=snap(); $('#asof').textContent='Barker & Stonehouse. Contact data as of '+dlab(sn._date)+'.';
  $('#foot').innerHTML='<p>Sales are valid orders that are not swatch-only; cancelled orders are shown separately. Online orders start in Oct 2024 and store orders in Jun 2026. Customers are matched by email address. Groups with fewer than 10 customers are hidden. No online refunds or returns are held in Ometria.</p>';
  if(top) window.scrollTo(0,0);
}
function buildTabs(){
  var n=$('#tabs'); n.innerHTML='';
  TABS.forEach(function(t){var b=document.createElement('button'); b.type='button'; b.dataset.tab=t[0]; b.textContent=t[1]; b.onclick=function(){state.tab=t[0]; render(true);}; n.appendChild(b);});
}
async function start(){
  msg('<h2>Loading the numbers</h2><p>Reading the summary tables from BigQuery.</p>');
  try{ await loadAll(); $('#signin').textContent='Reload data'; render(); }
  catch(e){ msg('<h2>The data could not be loaded</h2><p class="err">'+esc(e.message)+'</p><p>Check that you are signed in with an account that can read the customer_insights dataset.</p>'); }
}
function signIn(){
  if(window.__TEST_TOKEN__){token=window.__TEST_TOKEN__; return start();}
  if(token){ return start(); }
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){ msg('<h2>Google sign-in has not loaded</h2><p>Check your connection and reload the page.</p>'); return; }
  google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/bigquery.readonly',callback:function(r){ if(r&&r.access_token){token=r.access_token; start();} else msg('<h2>Sign-in did not complete</h2><p>Try again.</p>'); }}).requestAccessToken({prompt:''});
}
if(window.Chart){ Chart.defaults.font.family='"Source Sans 3",system-ui,sans-serif'; Chart.defaults.color='#1c2740'; Chart.defaults.borderColor='#e4dece'; }
$('#f-channel').onchange=function(e){state.channel=e.target.value; render();};
$('#f-months').onchange=function(e){state.months=+e.target.value; render();};
$('#signin').onclick=signIn;
buildTabs(); render();
msg('<h2>Customer insights</h2><p>How Barker &amp; Stonehouse customers behave, and what has changed since Oct 2024. Sign in with your Google account to load the data.</p>');
window.App={start:start,render:render,state:state,D:D,VIEWS:VIEWS,signIn:signIn};
})();
